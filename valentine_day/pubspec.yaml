name: valentine_day
description: Valentine Day Flutter App
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Utils
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.3.1
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  material_design_icons_flutter: ^7.0.7296
  intl: ^0.19.0

  # Ads
  google_mobile_ads: ^7.0.0

  # Firebase (MUST include core)
  firebase_core: ^3.10.0
  firebase_storage: ^12.3.0

  # iOS specific
  app_tracking_transparency: ^2.0.6
  launch_review: ^3.0.1
  flutter_local_notifications: ^18.0.1
  flutter_datetime_picker: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
